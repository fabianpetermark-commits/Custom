{% extends "base.html" %}
{% block content %}
<div class="navbar">
  <a href="/control"><button>Vissza</button></a>
</div>
<div class="container">
  <div class="log-section">
    <h2>Napló</h2>
    <input type="date" id="dateFilter" onchange="filterLogs()">
    <table class="log-table">
      <thead>
        <tr>
          <th>Idő</th>
          <th>Típus</th>
          <th>Esemény</th>
        </tr>
      </thead>
      <tbody id="logBody">
        {% for log in logs %}
        <tr data-date="{{ log.timestamp|truncate(10, true, '') }}">
          <td>{{ log.timestamp }}</td>
          <td>{{ log.type }}</td>
          <td>{{ log.message }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  function filterLogs() {
    const dateFilter = document.getElementById('dateFilter').value;
    const rows = document.querySelectorAll('#logBody tr');
    rows.forEach(row => {
      const rowDate = row.getAttribute('data-date');
      if (!dateFilter || rowDate === dateFilter) {
        row.style.display = '';
      } else {
        row.style.display = 'none';
      }
    });
  }
</script>
{% endblock %}
