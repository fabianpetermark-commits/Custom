<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4CAF50">
  <meta name="description" content="Rendszámfelismerő és kapunyitó alkalmazás">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Csopark</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icons/icon-192x192.png">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 0;
    }
    .navbar {
      background-color: #333;
      display: flex;
      align-items: center;
      padding: 10px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      gap: 15px;
    }
    .navbar a, .navbar form {
      display: block;
    }
    .navbar button {
      background-color: #4CAF50;
      color: white;
      padding: 8px 15px;
      margin: 0;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .navbar button:hover {
      background-color: #45a049;
    }
    .navbar .logout {
      margin-left: auto;
    }
    .container {
      max-width: 1200px;
      margin: 20px auto;
      display: flex;
      gap: 20px;
      padding-left: 10px;
    }
    .camera-grid {
      display: grid;
      grid-template-columns: repeat(2, 320px);
      gap: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 10px;
    }
    .camera-window {
      width: 320px;
      height: 240px;
      background-color: #ccc;
      border-radius: 5px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 14px;
    }
    .camera-window img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .whitelist-section, .log-section {
      max-width: fit-content;
      min-width: 200px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }
    .whitelist-section h2, .log-section h2 {
      margin-top: 0;
      font-size: 18px;
    }
    input[type=text], input[type=password], input[type=date] {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      display: inline-block;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 12px 20px;
      margin: 6px 0;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      opacity: 0.8;
    }
    .message {
      background-color: #ffffcc;
      padding: 8px;
      margin-top: 8px;
      border-radius: 5px;
      text-align: center;
      font-size: 14px;
    }
    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    li {
      padding: 6px;
      background: #eee;
      margin-top: 4px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    a {
      text-decoration: none;
    }
    .whitelist-section a {
      color: white;
      background-color: #f44336;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 12px;
    }
    .whitelist-section .delete-form {
      display: inline;
    }
    .whitelist-section .delete-btn {
      width: auto;
      color: white;
      background-color: #f44336;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 12px;
      margin: 0;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      display: none;
      z-index: 1000;
    }
    .toast.show {
      display: block;
    }
    .toast.success {
      background-color: #4CAF50;
    }
    .toast.error {
      background-color: #f44336;
    }
    .toast.info {
      background-color: #2196F3;
    }
    .log-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    .log-table th, .log-table td {
      padding: 8px;
      border: 1px solid #ddd;
      text-align: left;
      font-size: 14px;
    }
    .log-table th {
      background-color: #4CAF50;
      color: white;
    }
    .log-table tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .log-table tr:hover {
      background-color: #f1f1f1;
    }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/service-worker.js')
          .then(registration => {
            console.log('Service Worker registered with scope:', registration.scope);
          })
          .catch(error => {
            console.error('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</head>
<body>
<div id="toast" class="toast"></div>
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body></html>
